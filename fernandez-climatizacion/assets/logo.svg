<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem: Shield + Dual Air Wave & Letter F Monogram -->
  <g transform="translate(60, 60)">
    <!-- Base Shield Hexagon -->
    <path d="M0 -44 L38 -22 L38 22 L0 44 L-38 22 L-38 -22 Z" fill="#0B192C" stroke="url(#blueGrad)" stroke-width="2.5"/>
    
    <!-- Warm/Cold Dual Circulation Waves -->
    <!-- Warm Arc (Heat) -->
    <path d="M-22 -8 C-14 -28 14 -28 22 -8" fill="none" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Cold Arc (Cooling) -->
    <path d="M22 8 C14 28 -14 28 -22 8" fill="none" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round"/>

    <!-- Central Monogram "F" with Airflow Cutouts -->
    <path d="M-12 -20 L14 -20 L14 -12 L-4 -12 L-4 -4 L10 -4 L10 4 L-4 4 L-4 20 L-12 20 Z" fill="#FFFFFF"/>
    <circle cx="16" cy="-16" r="3" fill="url(#cyanAccent)"/>
  </g>

  <!-- Typography: FERNÁNDEZ -->
  <text x="125" y="54" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="2.5" fill="#FFFFFF">
    FERNÁNDEZ
  </text>
  
  <!-- Suffix: CLIMATIZACIÓN S.R.L. -->
  <text x="126" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="4.5" fill="#38BDF8">
    CLIMATIZACIÓN S.R.L.
  </text>

  <!-- Tagline: SHOWROOM & SERVICIO TÉCNICO OFICIAL -->
  <text x="127" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9.5" letter-spacing="2" fill="#94A3B8">
    VENTA OFICIAL · INSTALACIÓN CERTIFICADA · RÍO CUARTO
  </text>

  <!-- Divider line -->
  <line x1="126" y1="104" x2="380" y2="104" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
