<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#AA771C" />
      <stop offset="85%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8B5A00" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Snowflake + Mechanical Gear Climatization Fusion -->
  <g transform="translate(60, 60)" stroke="url(#goldGrad)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Glow back-layer -->
    <circle cx="0" cy="0" r="42" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4" stroke-dasharray="3 3"/>
    
    <!-- Gear center -->
    <circle cx="0" cy="0" r="14" fill="#0B0F17" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)"/>

    <!-- Gear cogs -->
    <path d="M-4 -14 L-2 -18 L2 -18 L4 -14" fill="url(#goldGrad)" stroke="none"/>
    <path d="M-4 14 L-2 18 L2 18 L4 14" fill="url(#goldGrad)" stroke="none"/>
    <path d="M-14 -4 L-18 -2 L-18 2 L-14 4" fill="url(#goldGrad)" stroke="none"/>
    <path d="M14 -4 L18 -2 L18 2 L14 4" fill="url(#goldGrad)" stroke="none"/>
    <path d="M-11 -9 L-14 -12 L-12 -14 L-9 -11" fill="url(#goldGrad)" stroke="none"/>
    <path d="M11 9 L14 12 L12 14 L9 11" fill="url(#goldGrad)" stroke="none"/>
    <path d="M-11 9 L-14 12 L-12 14 L-9 11" fill="url(#goldGrad)" stroke="none" transform="rotate(90)"/>
    <path d="M11 -9 L14 -12 L12 -14 L9 11" fill="url(#goldGrad)" stroke="none" transform="rotate(90)"/>

    <!-- 6 Snowflake arms -->
    <!-- Arm 1: Top (0 deg) -->
    <g>
      <line x1="0" y1="-18" x2="0" y2="-40" stroke-width="3"/>
      <path d="M-7 -27 L0 -33 L7 -27"/>
      <path d="M-11 -34 L0 -40 L11 -34"/>
      <circle cx="0" cy="-43" r="2" fill="url(#goldGrad)" stroke="none"/>
    </g>
    <!-- Arm 2: 60 deg -->
    <g transform="rotate(60)">
      <line x1="0" y1="-18" x2="0" y2="-40" stroke-width="3"/>
      <path d="M-7 -27 L0 -33 L7 -27"/>
      <path d="M-11 -34 L0 -40 L11 -34"/>
      <circle cx="0" cy="-43" r="2" fill="url(#goldGrad)" stroke="none"/>
    </g>
    <!-- Arm 3: 120 deg -->
    <g transform="rotate(120)">
      <line x1="0" y1="-18" x2="0" y2="-40" stroke-width="3"/>
      <path d="M-7 -27 L0 -33 L7 -27"/>
      <path d="M-11 -34 L0 -40 L11 -34"/>
      <circle cx="0" cy="-43" r="2" fill="url(#goldGrad)" stroke="none"/>
    </g>
    <!-- Arm 4: 180 deg -->
    <g transform="rotate(180)">
      <line x1="0" y1="-18" x2="0" y2="-40" stroke-width="3"/>
      <path d="M-7 -27 L0 -33 L7 -27"/>
      <path d="M-11 -34 L0 -40 L11 -34"/>
      <circle cx="0" cy="-43" r="2" fill="url(#goldGrad)" stroke="none"/>
    </g>
    <!-- Arm 5: 240 deg -->
    <g transform="rotate(240)">
      <line x1="0" y1="-18" x2="0" y2="-40" stroke-width="3"/>
      <path d="M-7 -27 L0 -33 L7 -27"/>
      <path d="M-11 -34 L0 -40 L11 -34"/>
      <circle cx="0" cy="-43" r="2" fill="url(#goldGrad)" stroke="none"/>
    </g>
    <!-- Arm 6: 300 deg -->
    <g transform="rotate(300)">
      <line x1="0" y1="-18" x2="0" y2="-40" stroke-width="3"/>
      <path d="M-7 -27 L0 -33 L7 -27"/>
      <path d="M-11 -34 L0 -40 L11 -34"/>
      <circle cx="0" cy="-43" r="2" fill="url(#goldGrad)" stroke="none"/>
    </g>
  </g>

  <!-- Typography: TÉCNICOS GD -->
  <text x="128" y="55" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="url(#goldGrad)">
    TÉCNICOS GD
  </text>
  
  <!-- Subtitle: LA EVOLUCIÓN DE LA CLIMATIZACIÓN -->
  <text x="130" y="80" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="12.5" letter-spacing="4.5" fill="#94A3B8">
    LA EVOLUCIÓN DE LA CLIMATIZACIÓN
  </text>

  <!-- Small accent line -->
  <line x1="130" y1="92" x2="280" y2="92" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="285" y1="92" x2="330" y2="92" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
