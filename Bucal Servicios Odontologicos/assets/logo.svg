<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Bucal Servicios Odontológicos - Logo">
  <defs>
    <!-- Fondo premium oscuro con toque teal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1c1f"/>
      <stop offset="100%" stop-color="#11272b"/>
    </linearGradient>
    <!-- Diente principal - degradado signature -->
    <linearGradient id="tooth" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <!-- Acento cálido premium (oro suave) -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Brillo sutil -->
    <linearGradient id="shine" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bg)"/>
  <!-- Borde sutil -->
  <rect x="10" y="10" width="100" height="100" rx="23" fill="none" stroke="#14b8a6" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Diente estilizado moderno (más ancho y elegante) -->
  <path id="toothPath" 
        d="M60 24 
           C46 24 38 29 34 38 
           Q30 52 33 66 
           Q36 82 46 88 
           Q52 91 60 91 
           Q68 91 74 88 
           Q84 82 87 66 
           Q90 52 86 38 
           C82 29 74 24 60 24 Z" 
        fill="url(#tooth)"/>

  <!-- Raíces sutiles -->
  <path d="M44 86 Q40 96 36 102" fill="none" stroke="#0f766e" stroke-width="5.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M60 89 Q60 100 60 106" fill="none" stroke="#0f766e" stroke-width="5.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M76 86 Q80 96 84 102" fill="none" stroke="#0f766e" stroke-width="5.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Brillo en corona del diente -->
  <path d="M42 32 Q52 38 58 30 Q64 42 72 34" fill="none" stroke="url(#shine)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Letra B integrada / acento superior -->
  <g>
    <!-- Pequeño acento "B" o curva de sonrisa -->
    <path d="M52 48 Q60 44 68 48" fill="none" stroke="#fcd34d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="52" r="3.2" fill="#fcd34d" opacity="0.9"/>
  </g>

  <!-- Texto BUCA pequeño abajo (opcional, se usa como icono) -->
  <!-- No texto en SVG del logo para que sea versátil; el texto se agrega en UI -->
</svg>
